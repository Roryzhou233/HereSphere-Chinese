name: Publish Chinese patch release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-release.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify final package
        working-directory: downloads
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.11.4-zh.1 \
            downloads/HereSphere_Chinese_Update.zip \
            downloads/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "HereSphere 0.11.4 简体中文补丁 v1" \
            --notes-file release/使用说明.md \
            --latest
